[server]
host = 0.0.0.0
port = 9000

[server.tls]
tls = true
certfile = none
keyfile = none

[server.keys]
jwt.duration = 7d
jwt_secret =

[server.aes_sync]
secret_key =
sync_path = /sync

[server.database]
max_cell_value_size_unit = mb
max_cell_value_bytes = 5120

[server.runtime]
workers = 4
reload = false
loop = auto
http = auto
backlog = 2048
limit_concurrency = 100
limit_max_requests = 10000
timeout_keep_alive = 75
timeout_worker_healthcheck = 5
proxy_headers = true
forwarded_allow_ips = 127.0.0.1

[server.compiler]
sandbox = true

[server.nukescripts]
sandbox = true

[server.sandbox]
usage_limit = false
memory_max = 512M
memory_swap_max = 0
cpu_quota = 150%
tasks_max = 128
runtime_max = 20min
allowed_paths = /tmp, /var/tmp

[server.armory]
repository = https://github.com/nukeratframework/armory/

[implants]
relay_aes_key =